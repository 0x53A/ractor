name: Unittests for wasm32-unknown-unknown
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  unit-test-unwind:
    name: Run browser tests with panic unwinding
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [cluster, "cluster,async-trait"]
    steps:
      - uses: actions/checkout@main
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: browser-actions/setup-firefox@v1
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Run tests including panic supervision and decoder recovery
        env:
          RUSTUP_TOOLCHAIN: nightly
          RUSTFLAGS: -Cpanic=unwind -Cllvm-args=-wasm-use-legacy-eh=false
          WASM_BINDGEN_TEST_TIMEOUT: 300
        run: wasm-pack test --headless --firefox ./ractor --lib --features "${{ matrix.features }}" -Zbuild-std=std,panic_unwind

  unit-test:
    name: Run unit tests in browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup test runner
        run: |
          cd ./.github/wasm-test-runner
          npm install

      - name: Run tests
        run: |
          export WORKING_DIR=$(pwd)
          cd ./.github/wasm-test-runner
          node ./index.js

  unit-test-output-port-v2:
    name: "Run unit tests in browser (features: output-port-v2)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup test runner
        run: |
          cd ./.github/wasm-test-runner
          npm install

      - name: "Run tests (features: output-port-v2)"
        env:
          FEATURES_OUTPUT_PORT_V2: "true"
        run: |
          export WORKING_DIR=$(pwd)
          cd ./.github/wasm-test-runner
          node ./index.js

  unit-test-async-trait:
    name: "Run unit tests in browser (features: async-trait)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup test runner
        run: |
          cd ./.github/wasm-test-runner
          npm install

      - name: "Run tests (features: async-trait)"
        env:
          FEATURES_ASYNC_TRAIT: "true"
        run: |
          export WORKING_DIR=$(pwd)
          cd ./.github/wasm-test-runner
          node ./index.js
